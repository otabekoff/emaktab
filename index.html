<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kundalik.com</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="container">
            <img src="./logo.svg" alt="Logotip">

            <div class="havolalar">
                <a href="#">Tashkilot</a>
                <a href="#">Imkoniyatlar</a>
                <a href="#">Hamkorlarga</a>
                <a href="#">Yordam</a>
            </div>

            <div class="tugmalar">
                <select name="til" id="til-tanlovchi">
                    <option value="uz">O'zbekcha</option>
                    <option value="ru">Ruscha</option>
                </select>
                <button id="kirish">Kirish</button>
                <button id="ulash">Tashkilotni ulash</button>
            </div>
        </div>
    </nav>

    <main>
        <div class="card-container">
            <div class="row-1">
                <h1>Kirish E-maktab</h1>
                <a href="#">Tizimda ro'yxatdan o'tganmisiz?</a>
            </div>
            <div class="row-2">
                <label for="login">Login</label>
                <input id="login" type="text">

                <label for="parol">Parol</label>
                <input id="parol" type="text">

                <button>Tizimga kiring</button>
            </div>
            <div class="row-3">
                <p><i data-lucide="question"></i> Login yoki parolni unutdingzmi? <a href="#">Loginni tiklash</a></p>
            </div>
        </div>
    </main>

</body>

</html>
